<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Placement Engine & Roadmap</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #030508;
            --card-bg: rgba(10, 15, 30, 0.85);
            --card-border: rgba(100, 255, 218, 0.15);
            --primary-accent: #00fff2;
            --secondary-accent: #7000ff;
            --text-main: #e0e6ed;
            --text-muted: #94a3b8;
            --success-glow: rgba(0, 255, 115, 0.6);
            --error-glow: rgba(255, 50, 50, 0.6);
            --input-bg: rgba(0, 0, 0, 0.4);
            --input-text: #ffffff;
            --header-bg: rgba(3, 5, 8, 0.8);
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(0, 0, 0, 0.1);
            --primary-accent: #007bff;
            --secondary-accent: #6f42c1;
            --text-main: #1a202c;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-text: #333333;
            --header-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Background Canvas */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        /* Layout */
        .wrapper {
            position: relative; z-index: 10; width: 100%; min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start; padding: 2rem 1rem;
        }
        .dashboard-container { width: 100%; max-width: 700px; margin: auto; perspective: 1000px; }

        /* Header */
        .top-controls {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem; background: var(--header-bg); backdrop-filter: blur(10px);
            padding: 10px 15px; border-radius: 12px; border: 1px solid var(--card-border);
        }
        .brand-title {
            font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.1rem;
            letter-spacing: 1px; background: linear-gradient(90deg, var(--text-main), var(--primary-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .icon-btn {
            background: transparent; border: 1px solid var(--card-border); color: var(--text-muted);
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        .icon-btn:hover { color: var(--primary-accent); border-color: var(--primary-accent); transform: translateY(-2px); }

        /* Hero */
        .hero-header { text-align: center; margin-bottom: 1.5rem; animation: fadeInDown 1s ease-out; }
        .hero-header h1 {
            font-family: 'Rajdhani', sans-serif; font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(90deg, var(--text-main), var(--primary-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Glass Card */
        .glass-card {
            background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border); border-radius: 20px;
            padding: clamp(1.5rem, 4vw, 2.5rem); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%; transition: background-color 0.4s ease; position: relative; overflow: hidden;
        }
        .glass-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-accent), transparent);
        }

        /* Section Divider */
        .section-divider {
            display: flex; align-items: center; text-align: center; margin: 1.5rem 0;
            color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;
        }
        .section-divider::before, .section-divider::after {
            content: ''; flex: 1; border-bottom: 1px solid var(--card-border);
        }
        .section-divider span { padding: 0 10px; color: var(--secondary-accent); font-weight: bold; }

        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 10px; }
        .input-group.full-width { grid-column: span 2; }

        /* Extra Fields Styling */
        .extra-fields-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; border: 1px dashed var(--card-border);
        }

        /* Slider Component */
        .slider-group { margin-bottom: 5px; }
        .slider-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .input-label {
            font-size: 0.75rem; color: var(--primary-accent);
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        }
        .slider-value-box {
            display: flex; align-items: center; gap: 10px;
        }
        .slider-value {
            font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700;
            color: var(--text-main); min-width: 30px; text-align: center;
        }
        .slider-input-mini {
            width: 50px; background: var(--input-bg); border: 1px solid var(--card-border);
            color: var(--primary-accent); border-radius: 4px; padding: 2px 5px; font-family: 'Rajdhani', sans-serif;
            font-weight: 700; text-align: center; font-size: 0.9rem;
        }
        .slider-input-mini:focus { border-color: var(--primary-accent); outline: none; }

        /* Range Input Styling */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer;
        }
        input[type=range]:focus { outline: none; }
        
        /* Slider Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer;
            background: rgba(255,255,255,0.1); border-radius: 3px;
        }
        input[type=range]::-moz-range-track {
            width: 100%; height: 6px; cursor: pointer;
            background: rgba(255,255,255,0.1); border-radius: 3px;
        }
        
        /* Slider Thumb */
        input[type=range]::-webkit-slider-thumb {
            height: 18px; width: 18px; border-radius: 50%; background: var(--primary-accent);
            cursor: pointer; -webkit-appearance: none; margin-top: -6px; /* center on track */
            box-shadow: 0 0 10px var(--primary-accent); transition: transform 0.1s;
        }
        input[type=range]::-moz-range-thumb {
            height: 18px; width: 18px; border: none; border-radius: 50%; background: var(--primary-accent);
            cursor: pointer; box-shadow: 0 0 10px var(--primary-accent); transition: transform 0.1s;
        }
        input[type=range]:active::-webkit-slider-thumb { transform: scale(1.2); }
        
        .slider-min-max {
            display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted);
            margin-top: 4px; font-family: 'Rajdhani', sans-serif;
        }

        /* Select & Number Input (Extra fields) */
        .cyber-select, .cyber-number {
            width: 100%; background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; padding: 12px; color: var(--input-text);
            font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600; transition: all 0.3s;
            appearance: none; /* remove default arrow for select */
        }
        .cyber-select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300fff2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 10px auto;
        }
        [data-theme="light"] .cyber-select { border: 1px solid rgba(0, 0, 0, 0.15); background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007bff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); }
        
        .cyber-select:focus, .cyber-number:focus { border-color: var(--primary-accent); box-shadow: 0 0 15px rgba(0, 255, 242, 0.2); }
        .cyber-number { -moz-appearance: textfield; }
        .cyber-number::-webkit-outer-spin-button, .cyber-number::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* Action Buttons Container */
        .action-buttons { display: flex; gap: 15px; margin-top: 30px; }
        
        /* Submit Button Styles (Full Width now since Clear is gone) */
        .submit-btn {
            width: 100%; 
            padding: 1.2rem 1.5rem;
            background: linear-gradient(135deg, rgba(0, 255, 242, 0.1), rgba(0, 255, 242, 0.05));
            color: var(--primary-accent);
            border: 1px solid var(--primary-accent);
            font-family: 'Rajdhani', sans-serif; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 242, 0.1);
            text-shadow: 0 0 5px rgba(0, 255, 242, 0.5);
        }

        /* Glowing Border Effect */
        .submit-btn::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 242, 0.4), transparent);
            transition: 0.5s;
        }

        .submit-btn:hover {
            background: var(--primary-accent);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 242, 0.6), inset 0 0 10px rgba(255,255,255,0.5);
            transform: translateY(-2px);
            text-shadow: none;
        }
        
        .submit-btn:hover::before { left: 100%; }
        
        .submit-btn:active { transform: translateY(1px); }

        /* Icon Animation */
        .submit-btn i { font-size: 1.2rem; transition: transform 0.3s ease; }
        .submit-btn:hover i { transform: scale(1.2) rotate(10deg); }

        /* Result Section */
        .result-panel { margin-top: 25px; border-top: 1px solid var(--card-border); padding-top: 20px; display: none; animation: slideIn 0.5s ease; }
        .result-header { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .result-box {
            background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.05); padding: 15px;
            border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 700;
            text-align: center; margin-bottom: 20px;
        }
        .result-placed { color: #00ff73; border-color: rgba(0, 255, 115, 0.5); box-shadow: 0 0 15px rgba(0, 255, 115, 0.15); }
        .result-not-placed { color: #ff3232; border-color: rgba(255, 50, 50, 0.5); }

        /* AI Report Section */
        .ai-report-container {
            background: rgba(255, 255, 255, 0.03); 
            border-radius: 8px; 
            padding: 20px; 
            margin-top: 20px;
            border: 1px solid var(--card-border); 
            max-height: 600px;
            overflow-y: auto;
        }
        /* Custom Scrollbar */
        .ai-report-container::-webkit-scrollbar { width: 6px; }
        .ai-report-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .ai-report-container::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }

        .ai-title {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
            color: var(--secondary-accent); font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase;
        }
        .download-btn {
            background: transparent; border: 1px solid var(--secondary-accent); color: var(--secondary-accent);
            padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 5px;
            transition: all 0.2s;
        }
        .download-btn:hover { background: rgba(112, 0, 255, 0.1); }
        .download-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .report-content { 
            font-size: 0.9rem; 
            line-height: 1.6; 
            color: var(--text-main); 
            white-space: pre-wrap; 
        }
        
        /* Markdown-like formatting styles */
        .report-content strong { color: var(--primary-accent); font-weight: 700; }
        .report-content h3 { color: var(--text-main); margin-top: 15px; margin-bottom: 5px; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid var(--card-border); padding-bottom: 5px; }
        .report-content ul { padding-left: 20px; margin: 10px 0; }
        .report-content li { margin-bottom: 5px; }

        /* Loader */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 5, 8, 0.9);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        [data-theme="light"] .loader-overlay { background: rgba(255, 255, 255, 0.9); }
        .loader-overlay.active { opacity: 1; pointer-events: all; }
        .scan-line {
            width: 200px; height: 2px; background: var(--primary-accent); box-shadow: 0 0 10px var(--primary-accent);
            animation: scan 1.5s infinite linear; margin-bottom: 20px;
        }
        .loader-text { font-family: 'Rajdhani', sans-serif; color: var(--primary-accent); letter-spacing: 3px; animation: pulse 1s infinite alternate; }

        /* Error/Status Message */
        .status-message {
            margin-top: 10px; padding: 10px; border-radius: 5px; font-size: 0.9rem; text-align: center; display: none;
        }
        .status-error { background: rgba(255, 50, 50, 0.1); border: 1px solid var(--error-glow); color: #ff5050; }

        @keyframes scan { 0% { width: 0; opacity: 0; } 50% { width: 200px; opacity: 1; } 100% { width: 0; opacity: 0; margin-left: 200px; } }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; text-shadow: 0 0 10px var(--primary-accent); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        @media (max-width: 600px) {
            .form-grid, .extra-fields-grid { grid-template-columns: 1fr; gap: 15px; }
            .input-group.full-width { grid-column: span 1; }
            .wrapper { padding: 1rem; padding-top: 2rem; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="loader-overlay" id="loader">
        <div class="scan-line"></div>
        <div class="loader-text">ANALYZING DATA...</div>
    </div>

    <div class="wrapper">
        <div class="dashboard-container">
            
            <div class="top-controls">
                <div class="brand-title"><i class="fa-solid fa-robot"></i> AI ENGINE</div>
                <button class="icon-btn" id="themeToggle" title="Toggle Dark/Light Mode"><i class="fa-solid fa-moon"></i></button>
            </div>

            <div class="hero-header">
                <h1>Placement <span style="color:var(--primary-accent)">Model</span></h1>
                <p>AI-Powered Prediction & Roadmap</p>
            </div>

            <div class="glass-card">
                <form id="predictForm">
                    
                    <!-- EXTRA UI FIELDS (NOT SENT TO MODEL) -->
                    <div class="section-divider"><span>Personal Profile</span></div>
                    <div class="extra-fields-grid">
                        <div class="input-group">
                            <label class="input-label">Gender</label>
                            <select name="gender" class="cyber-select">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label class="input-label">Age</label>
                            <input type="number" name="age" class="cyber-number" placeholder="Enter Age">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Degree</label>
                            <select name="degree" class="cyber-select">
                                <option value="B.Tech">B.Tech</option>
                                <option value="M.Tech">M.Tech</option>
                                <option value="BCA">BCA</option>
                                <option value="MCA">MCA</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label class="input-label">Branch</label>
                            <select name="branch" class="cyber-select">
                                <option value="CSE">CSE</option>
                                <option value="ECE">ECE</option>
                                <option value="ME">ME</option>
                                <option value="IT">IT</option>
                            </select>
                        </div>
                    </div>

                    <!-- MODEL INPUT FIELDS (SLIDERS) -->
                    <div class="section-divider"><span>Academic & Skills Analysis</span></div>
                    <div class="form-grid">
                        
                        <!-- CGPA: 0-10 -->
                        <div class="input-group full-width slider-group">
                            <div class="slider-header">
                                <label class="input-label"><i class="fa-solid fa-graduation-cap"></i> CGPA</label>
                                <div class="slider-value-box">
                                    <span class="slider-value" id="val-cgpa">7.5</span>
                                    <input type="number" class="slider-input-mini" id="txt-cgpa" value="7.5" step="0.1">
                                </div>
                            </div>
                            <input type="range" name="cgpa" id="cgpa" min="0" max="10" step="0.1" value="7.5">
                            <div class="slider-min-max">Min: 0 | Max: 10</div>
                        </div>

                        <!-- Aptitude: 0-100 -->
                        <div class="input-group full-width slider-group">
                            <div class="slider-header">
                                <label class="input-label"><i class="fa-solid fa-brain"></i> Aptitude Score</label>
                                <div class="slider-value-box">
                                    <span class="slider-value" id="val-aptitude_score">60</span>
                                    <input type="number" class="slider-input-mini" id="txt-aptitude_score" value="60" step="1">
                                </div>
                            </div>
                            <input type="range" name="aptitude_score" id="aptitude_score" min="0" max="100" step="1" value="60">
                            <div class="slider-min-max">Min: 0 | Max: 100</div>
                        </div>

                        <!-- Coding Skills: 0-10 -->
                        <div class="input-group slider-group">
                            <div class="slider-header">
                                <label class="input-label"><i class="fa-solid fa-code"></i> Coding</label>
                                <div class="slider-value-box">
                                    <span class="slider-value" id="val-coding_skills">5</span>
                                    <input type="number" class="slider-input-mini" id="txt-coding_skills" value="5" step="1">
                                </div>
                            </div>
                            <input type="range" name="coding_skills" id="coding_skills" min="0" max="10" step="1" value="5">
                            <div class="slider-min-max">Min: 0 | Max: 10</div>
                        </div>

                        <!-- Communication Skills: 1-10 -->
                        <div class="input-group slider-group">
                            <div class="slider-header">
                                <label class="input-label"><i class="fa-solid fa-comments"></i> Comm. Skills</label>
                                <div class="slider-value-box">
                                    <span class="slider-value" id="val-communication_skills">5</span>
                                    <input type="number" class="slider-input-mini" id="txt-communication_skills" value="5" step="1">
                                </div>
                            </div>
                            <input type="range" name="communication_skills" id="communication_skills" min="1" max="10" step="1" value="5">
                            <div class="slider-min-max">Min: 1 | Max: 10</div>
                        </div>

                        <!-- Internships: 0-5 -->
                        <div class="input-group slider-group">
                            <div class="slider-header">
                                <label class="input-label"><i class="fa-solid fa-briefcase"></i> Internships</label>
                                <div class="slider-value-box">
                                    <span class="slider-value" id="val-internships">1</span>
                                    <input type="number" class="slider-input-mini" id="txt-internships" value="1" step="1">
                                </div>
                            </div>
                            <input type="range" name="internships" id="internships" min="0" max="5" step="1" value="1">
                            <div class="slider-min-max">Min: 0 | Max: 5</div>
                        </div>

                        <!-- Certifications: 0-10 -->
                        <div class="input-group slider-group">
                            <div class="slider-header">
                                <label class="input-label"><i class="fa-solid fa-certificate"></i> Certifications</label>
                                <div class="slider-value-box">
                                    <span class="slider-value" id="val-certifications">2</span>
                                    <input type="number" class="slider-input-mini" id="txt-certifications" value="2" step="1">
                                </div>
                            </div>
                            <input type="range" name="certifications" id="certifications" min="0" max="10" step="1" value="2">
                            <div class="slider-min-max">Min: 0 | Max: 10</div>
                        </div>

                        <!-- Projects: 0-10 -->
                        <div class="input-group full-width slider-group">
                            <div class="slider-header">
                                <label class="input-label"><i class="fa-solid fa-folder-open"></i> Projects</label>
                                <div class="slider-value-box">
                                    <span class="slider-value" id="val-projects">3</span>
                                    <input type="number" class="slider-input-mini" id="txt-projects" value="3" step="1">
                                </div>
                            </div>
                            <input type="range" name="projects" id="projects" min="0" max="10" step="1" value="3">
                            <div class="slider-min-max">Min: 0 | Max: 10</div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <!-- Submit Button is now full width -->
                        <button type="submit" class="submit-btn">
                            Run Analysis <i class="fa-solid fa-microchip"></i>
                        </button>
                    </div>
                </form>

                <!-- Status/Error Area -->
                <div id="statusArea" class="status-message"></div>

                <!-- Prediction Result -->
                <div class="result-panel" id="resultPanel">
                    <div class="result-header"><i class="fa-solid fa-terminal"></i> Prediction Output</div>
                    <div class="result-box" id="resultBox">
                        <span id="predictionText"></span>
                    </div>

                    <!-- AI Suggestion Report -->
                    <div class="ai-report-container" id="aiContainer" style="display:none;">
                        <div class="ai-title">
                            <span><i class="fa-solid fa-wand-magic-sparkles"></i> AI Career Roadmap</span>
                            
                            <!-- Generate Button -->
                            <button class="download-btn" id="generateBtn">
                                <i class="fa-solid fa-wand-magic"></i> Generate AI Report
                            </button>
                            
                            <!-- Download Button -->
                            <button class="download-btn" id="downloadBtn" style="display:none;">
                                <i class="fa-solid fa-file-pdf"></i> Download PDF
                            </button>
                        </div>
                        <div class="report-content" id="aiReportContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Particle Background (Simplified)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = document.body.getAttribute('data-theme') === 'light' ? 'rgba(0,123,255,0.5)' : 'rgba(0,255,242,0.5)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for(let i=0; i<50; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animateParticles();

        // Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggle');
        themeToggleBtn.addEventListener('click', () => {
            const body = document.body;
            const isLight = body.getAttribute('data-theme') === 'light';
            body.setAttribute('data-theme', isLight ? 'dark' : 'light');
            themeToggleBtn.querySelector('i').className = isLight ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        });

        // Logic
        const form = document.getElementById('predictForm');
        const loader = document.getElementById('loader');
        const resultPanel = document.getElementById('resultPanel');
        const resultBox = document.getElementById('resultBox');
        const predictionText = document.getElementById('predictionText');
        const aiContainer = document.getElementById('aiContainer');
        const aiReportContent = document.getElementById('aiReportContent');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusArea = document.getElementById('statusArea');

        let currentData = {}; 

        // --- Slider + Text Input Sync Logic ---
        const sliders = document.querySelectorAll('input[type="range"]');
        sliders.forEach(slider => {
            const txtId = "txt-" + slider.name;
            const valId = "val-" + slider.name;
            const txtInput = document.getElementById(txtId);
            const valDisplay = document.getElementById(valId);

            // Slider changes -> Update Text & Display
            slider.addEventListener('input', function() {
                txtInput.value = this.value;
                valDisplay.textContent = this.value;
                updateValueColor(valDisplay, this.value, this.max);
            });

            // Text Input changes -> Update Slider & Display
            if(txtInput) {
                txtInput.addEventListener('input', function() {
                    let val = parseFloat(this.value);
                    
                    // Validation: Ensure value is within slider bounds
                    let min = parseFloat(slider.min);
                    let max = parseFloat(slider.max);
                    
                    if (isNaN(val)) val = min;
                    if (val < min) val = min;
                    if (val > max) val = max; // Clamp to max visually

                    slider.value = val;
                    valDisplay.textContent = val;
                    updateValueColor(valDisplay, val, slider.max);
                });

                // On blur, if out of bounds, clamp it fully in text box
                txtInput.addEventListener('change', function() {
                    let val = parseFloat(this.value);
                    if (isNaN(val) || val < parseFloat(slider.min) || val > parseFloat(slider.max)) {
                        // If user entered garbage, reset to slider value
                        this.value = slider.value;
                        valDisplay.textContent = slider.value;
                    }
                });
            }
        });

        function updateValueColor(element, value, max) {
            if(parseFloat(value) > (parseFloat(max) * 0.8)) {
                element.style.color = "#00ff73";
            } else {
                element.style.color = "var(--text-main)";
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            loader.classList.add('active');
            statusArea.style.display = 'none';

            // Hide previous results if any
            aiContainer.style.display = 'none';

            const formData = new FormData(form);

            // ---------------------------------------------------------
            // FILTER: Remove extra UI fields before sending to Backend
            // ---------------------------------------------------------
            formData.delete('gender');
            formData.delete('age');
            formData.delete('degree');
            formData.delete('branch');
            // ---------------------------------------------------------

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Server Error");

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                // Update UI for Prediction
                loader.classList.remove('active');
                resultPanel.style.display = 'block';
                
                // Show AI Container but in "Ready to Generate" state
                aiContainer.style.display = 'block';
                aiReportContent.innerHTML = '<p style="text-align:center; color:var(--text-muted)">Click "Generate AI Report" to get your personalized roadmap.</p>';
                
                // Reset Buttons
                generateBtn.style.display = 'flex';
                downloadBtn.style.display = 'none';
                generateBtn.innerHTML = '<i class="fa-solid fa-wand-magic"></i> Generate AI Report';
                generateBtn.disabled = false;

                // Set Result
                resultBox.classList.remove('result-placed', 'result-not-placed');
                predictionText.textContent = data.prediction + " (" + data.confidence + ")";
                
                if (data.prediction.toLowerCase().includes('placed')) {
                    resultBox.classList.add('result-placed');
                } else {
                    resultBox.classList.add('result-not-placed');
                }

                // Store data for next steps
                currentData = data;

            } catch (error) {
                console.error(error);
                loader.classList.remove('active');
                // Show UI error message instead of native alert
                statusArea.textContent = "Error: " + error.message;
                statusArea.className = "status-message status-error";
                statusArea.style.display = 'block';
            }
        });

        // Helper function to format Markdown
        function formatMarkdownHTML(text) {
            if (!text) return '';
            let formatted = text.replace(/\n/g, '<br>');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            return formatted;
        }

        // Generate Report Logic
        generateBtn.addEventListener('click', async () => {
            if (!currentData.prediction) return;

            // UI Loading State
            generateBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Generating...';
            generateBtn.disabled = true;
            aiReportContent.innerHTML = '<p style="text-align:center">Consulting AI Career Counselor...</p>';

            try {
                const response = await fetch('/generate-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prediction: currentData.prediction,
                        input_data: currentData.input_data
                    })
                });

                const resData = await response.json();

                if (resData.error) {
                    throw new Error(resData.error);
                }

                // Store RAW text for PDF generation
                currentData.ai_report = resData.ai_report;

                // Format text for HTML Preview
                const previewHTML = formatMarkdownHTML(resData.ai_report);

                // Update UI with Report
                aiReportContent.innerHTML = previewHTML;
                
                // Switch Buttons
                generateBtn.style.display = 'none';
                downloadBtn.style.display = 'flex';

            } catch (error) {
                console.error("AI Error:", error);
                aiReportContent.innerHTML = `<span style="color:var(--error-glow)">Error: ${error.message}</span>`;
                generateBtn.innerHTML = 'Retry';
                generateBtn.disabled = false;
            }
        });

        // PDF Download Logic
        downloadBtn.addEventListener('click', async () => {
            if (!currentData.ai_report) return;

            const btnOriginalHTML = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Preparing PDF...';
            downloadBtn.disabled = true;

            try {
                const response = await fetch('/download_report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentData)
                });

                if (!response.ok) throw new Error("PDF Generation Failed");

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "AI_Placement_Report.pdf";
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

            } catch (error) {
                console.error("Download error:", error);
                statusArea.textContent = "Error downloading PDF: " + error.message;
                statusArea.className = "status-message status-error";
                statusArea.style.display = 'block';
            } finally {
                downloadBtn.innerHTML = btnOriginalHTML;
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
